# Variáveis de ambiente obrigatórias (a aplicação não sobe sem elas):
#   MYSQL_USER, MYSQL_PASSWORD, JWT_SECRET (mínimo 32 bytes aleatórios),
#   ADMIN_EMAIL, ADMIN_PASSWORD (mínimo 8 caracteres), APP_BASE_URL (ex.: https://agenda.exemplo.com),
#   EMAIL_USERNAME, EMAIL_PASSWORD
spring.datasource.url=jdbc:mysql://localhost:3306/agenda_db
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

app.base-url=${APP_BASE_URL}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.mail.from-name=Agenda Z\u00e9lia

jwt.secret=${JWT_SECRET}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
